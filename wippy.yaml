organization: chicago
module: calculator
description: Calculator for the Chicago desktop — the mid-nineties standard view with memory, a pure arithmetic engine and a window on the shell SDK (chicago/shell).
license: MIT
repository: https://github.com/chicago-desktop/calculator
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - chicago
  - calculator
# No `version:` here — the publisher picks it (`wippy publish` bumps the
# latest published one). A published version is immutable.
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# `wippy publish` packs the entries of src/ and embeds only the fs.directory
# entries named under `embed:`. The image pack lives outside src/ and is
# packed only when named here.
embed:
  - chicago.calculator:images
