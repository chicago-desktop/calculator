version: "1.0"
namespace: app

# Standalone harness for windows/calculator. Provides the host resources
# the boot needs (app:db, app:processes, a gateway and a router for the
# shell's endpoints, env storage, a permissive actor scope) and runs the
# co-located *_test.lua suites. Excluded from publish by the module's
# wippy.yaml.
#
# Every test entry is a function.lua with `meta.type: test`; `wippy test`
# runs the ones it discovers. A test file must be in the run_cases form
# (see engine_test.lua) — the other form is counted, printed green and never
# executed.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: Calculator Test Harness}

  - name: engine_test
    kind: function.lua
    meta:
      type: test
      comment: "The calculator computes like the buttons, not like an expression; memory survives a clear; failures are phrases; keys reach the same buttons as the mouse; the SDK keys stand in the original's grid and show every caption whole in pixels and in cells; the About sheet."
      group: Calculator
      suite: windows_calculator
    source: file://engine_test.lua
    method: run
    # `gfx` and `fs` to measure the captions in the shell's bold font, read
    # as bytes from app:system_fonts; `tty` for the cell widgets' styles.
    modules: [gfx, tty, fs]
    imports:
      test: wippy.test:test
      ui: windows.shell.sdk:ui
      pixels: windows.shell.theme:pixels
      widgets: windows.shell.theme:widgets
      chrome: windows.shell.theme:chrome
      engine: windows.calculator:engine
      window: windows.calculator:window

  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "The calculator's process — the registry entry the Start menu reads (fixed size, in Programs, the shell's calculator icon found at both sizes), the process running the engine, and test/shots/calculator.png drawn by the shell's renderer."
      group: Calculator
      suite: windows_calculator
    source: file://window_test.lua
    method: run
    # Reading the entry takes `registry.get`; the icon and the shot take
    # `gfx`, and `fs` for the fonts and the shots folder.
    modules: [gfx, fs, registry]
    imports:
      test: wippy.test:test
      app: windows.shell.sdk:app
      ui: windows.shell.sdk:ui
      render: windows.shell.sdk:render
      rasters: windows.shell.theme:rasters
      images: windows.shell.theme:images
      engine: windows.calculator:engine
      window: windows.calculator:window

  - name: shots
    kind: fs.directory
    meta:
      comment: Where the window's shot goes.
    base: project
    directory: ./shots
    auto_init: true

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: System TrueType fonts, read-only — the font arrives in gfx as bytes, not as a path.
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the calculator does not use it, but the shell's migrations ask for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229, the template's
  # :19239 and the other modules' harnesses, so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19241
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: calculator_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "windows/calculator"

  - name: calculator_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: calculator_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: calculator_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
